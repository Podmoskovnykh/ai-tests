<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Plant Growth Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 60%, #228B22 60%);
            overflow: hidden;
        }

        svg {
            max-width: 800px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .stem {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .leaf {
            transform-origin: center;
        }

        .leaf-foliage {
            mix-blend-mode: multiply;
        }

        .dirt {
            filter: blur(2px);
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
        <!-- Sky and ground -->
        <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#87CEEB"/>
                <stop offset="60%" style="stop-color:#87CEEB"/>
            </linearGradient>
            <clipPath id="groundClip">
                <rect x="0" y="360" width="400" height="240"/>
            </clipPath>
        </defs>

        <!-- Ground -->
        <rect class="dirt" fill="#8B4513" clip-path="url(#groundClip)" rx="10"/>
        <ellipse class="dirt" cx="200" cy="360" rx="150" ry="25" fill="#A0522D" opacity="0.7"/>

        <!-- Stem group -->
        <g id="plant">
            <!-- Main stem with segments that extend over time -->
            <path class="stem" id="mainStem" 
                d="" 
                stroke="#4a3c2a" 
                stroke-width="18" 
                fill="none"/>
            
            <!-- Branches and leaves will be added dynamically via JS -->
        </g>

        <!-- Sun -->
        <circle cx="350" cy="50" r="30" fill="#FFD700">
            <animate attributeName="r" values="28;32;28" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
        </circle>

        <!-- Clouds -->
        <g id="clouds">
            <ellipse cx="50" cy="30" rx="25" ry="12" fill="#fff">
                <animate attributeName="cx" values="45;55;45" dur="8s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="70" cy="28" rx="30" ry="14" fill="#fff">
                <animate attributeName="cx" values="65;75;65" dur="10s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="320" cy="25" rx="35" ry="16" fill="#fff">
                <animate attributeName="cx" values="315;325;315" dur="12s" repeatCount="indefinite"/>
            </ellipse>
        </g>

        <!-- Wind particles -->
        <g id="windParticles"></g>
    </svg>

    <script>
        // Plant growth simulation with SVG
        const mainStem = document.getElementById('mainStem');
        const plantGroup = document.getElementById('plant');
        const windParticles = document.getElementById('windParticles');
        
        let time = 0;
        let isGrowing = true;
        let growthPhase = 'stem'; // stem, leaves, mature
        
        // Wind simulation
        function createWindParticle() {
            const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            const x = Math.random() * 400;
            const y = Math.random() * 600 + 50;
            
            particle.setAttribute('cx', x);
            particle.setAttribute('cy', y);
            particle.setAttribute('r', Math.random() * 3 + 1);
            particle.setAttribute('fill', 'rgba(255,255,255,' + (Math.random() * 0.4 + 0.2) + ')');
            
            windParticles.appendChild(particle);
            
            let particleX = x;
            let particleY = y;
            const speed = Math.random() * 3 + 1;
            const wobble = Math.sin(time * 0.5 + Math.random() * 10) * 2;
            
            function animateParticle() {
                if (!isGrowing) return;
                
                particleX += speed;
                particleY += (Math.sin(time * 0.3) + wobble / 10);
                
                particle.setAttribute('cx', particleX);
                particle.setAttribute('cy', particleY);
                
                requestAnimationFrame(animateParticle);
            }
            
            animateParticle();
        }

        // Draw bezier curve for stem segments
        function createStemSegment(startX, startY, endX, endY, width, segmentIndex) {
            const numPoints = 15;
            let pathData = `M ${startX} ${startY}`;
            
            for (let i = 1; i < numPoints; i++) {
                const t = i / numPoints;
                const easeT = easeOutCubic(t);
                
                // Create curved stem with slight sway in wind
                const x = startX + (endX - startX) * easeT;
                const y = startY + (endY - startY) * easeT;
                const sway = Math.sin(time * 0.1 + segmentIndex) * width * 0.05;
                
                pathData += ` L ${x + sway} ${y}`;
            }
            
            return pathData;
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // Create leaves with springy animation
        function createLeaf(positionIndex) {
            const leafGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            leafGroup.setAttribute('class', 'leaf-group');
            leafGroup.setAttribute('data-index', positionIndex);
            
            // Main leaf blade
            const leafBlade = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            leafBlade.setAttribute('d', 'M 0 0 Q -15 8 -20 20 L -10 25 L -5 20 L 0 25 L 5 20 L 10 25 L 15 20 Q 20 8 0 0 Z');
            leafBlade.setAttribute('class', 'leaf');
            leafBlade.setAttribute('fill', '#4a7c23');
            
            // Leaf foliage for depth
            const leafFoliage = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            leafFoliage.setAttribute('d', 'M -18 5 Q -16 12 -14 18 L -12 22 L -8 19 L -7 22 L -3 19 L -2 22 L 0 19');
            leafFoliage.setAttribute('class', 'leaf foliage leaf-foliage');
            leafFoliage.setAttribute('fill', '#3d6b1c');
            
            // Leaf stem connector
            const leafStem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            leafStem.setAttribute('stroke', '#5c8a49');
            leafStem.setAttribute('stroke-width', '2.5');
            
            leafGroup.appendChild(leafBlade);
            leafGroup.appendChild(leafFoliage);
            leafGroup.appendChild(leafStem);
            
            plantGroup.appendChild(leafGroup);
            
            return { group: leafGroup, blade: leafBlade };
        }

        // Draw the current stem state
        function drawStem() {
            if (!isGrowing) return;
            
            let pathData = '';
            const segments = 12;
            let currentX = 80;
            let currentY = 560;
            let totalHeight = 0;
            
            // Calculate growth based on time and phase
            let targetSegments = 0;
            if (growthPhase === 'stem') {
                targetSegments = Math.floor(Math.min(6, 2 + time * 0.1));
            } else if (growthPhase === 'leaves') {
                targetSegments = 8;
            } else {
                targetSegments = 10;
            }
            
            for (let i = 0; i < targetSegments; i++) {
                const segmentHeight = Math.random() * 35 + 25;
                
                // Add natural sway in wind
                const swayX = Math.sin(time * 0.15 + i) * 8;
                const swayY = Math.cos(time * 0.15 + i) * 4;
                
                pathData += createStemSegment(currentX, currentY - totalHeight, 
                    currentX + swayX, (currentY - totalHeight) - segmentHeight, 12, i);
                
                // Add branch with leaves at certain segments
                if (i >= 3 && growthPhase !== 'stem' && i % 2 === 0) {
                    const leaf = createLeaf(i * 2 + Math.random());
                    
                    // Animate leaf springing out
                    let leafAngle = -90;
                    const animateSpring = () => {
                        if (!isGrowing || leaf.group.parentNode !== plantGroup) return;
                        
                        const targetAngle = (Math.random() - 0.5) * 60 + 30;
                        const windAngle = Math.sin(time * 0.1 + i) * 15;
                        
                        leaf.group.setAttribute('transform', 
                            `translate(${currentX + swayX}, ${currentY - totalHeight}) rotate(${leafAngle}) scale(0 + (time * 0.3))`);
                        
                        // Animate blade unfurling
                        const scale = Math.min(time * 0.5, leaf.blade.getAttributeNS(null, 'transform'));
                        if (!scale || parseFloat(scale) < 1) {
                            leaf.group.setAttribute('transform', 
                                `translate(${currentX + swayX}, ${currentY - totalHeight}) rotate(${leafAngle} ${windAngle}) scale(${0.5 + time * 0.25})`);
                        } else {
                            // Leaf fully grown, add wind animation
                            leaf.group.setAttribute('transform', 
                                `translate(${currentX + swayX}, ${currentY - totalHeight}) rotate(${targetAngle} ${windAngle})`);
                            leaf.blade.classList.add('animate-wind');
                        }
                        
                        time += 0.5;
                        requestAnimationFrame(animateSpring);
                    };
                    
                    animateSpring();
                }
                
                currentX += swayX;
                totalHeight += segmentHeight;
            }
            
            mainStem.setAttribute('d', pathData);
        }

        // Main animation loop
        function animate() {
            time++;
            
            // Progress through growth phases
            if (growthPhase === 'stem' && time > 100) {
                growthPhase = 'leaves';
            } else if ((growthPhase === 'leaves' || growthPhase === 'mature') && 
                       time % 200 < 50 && Math.random() > 0.7) {
                // Occasional wind gusts
                const leaves = plantGroup.querySelectorAll('.leaf-group');
                leaves.forEach(leaf => {
                    if (leaf.parentNode !== plantGroup) return;
                    
                    const targetAngle = parseFloat(leaf.getAttribute('transform')) || 0;
                    const currentTransform = leaf.getAttribute('transform') || '';
                    let angleMatch = currentTransform.match(/rotate\(([^\)]+)\)/);
                    const currentAngle = angleMatch ? parseInt(angleMatch[1].split(' ')[0]) : -90;
                    
                    // Apply gust
                    const windEffect = Math.sin(time * 2) * 35;
                    leaf.setAttribute('transform', `translate(80, ${currentY || 560}) rotate(${currentAngle + windEffect} ${windEffect})`);
                });
            }
            
            drawStem();
            
            // Create new wind particles periodically
            if (time % 10 === 0) {
                createWindParticle();
                
                // Remove old particles
                const oldParticles = windParticles.querySelectorAll('circle');
                for (let i = oldParticles.length - 1; i >= 0; i--) {
                    const particle = oldParticles[i];
                    if (parseFloat(particle.getAttribute('cx')) > 420) {
                        particle.parentNode.removeChild(particle);
                    }
                }
            }
            
            requestAnimationFrame(animate);
        }

        // Initialize
        animate();
    </script>
</body>
</html>
