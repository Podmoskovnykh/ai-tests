<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Poly Dino Runner</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #score { position: absolute; top: 20px; right: 20px; font-family: Arial, sans-serif; font-size: 24px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: Arial, sans-serif; font-size: 48px; color: white; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: none; }
        #restartBtn { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); padding: 12px 24px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; }
        #restartBtn:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="gameOver">Game Over</div>
    <button id="restartBtn">Restart</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game constants
        const GROUND_WIDTH = 200;
        const GROUND_HEIGHT = 50;
        const INITIAL_SPEED = 5;
        const SPEED_INCREASE = 0.001;
        const OBSTACLE_SPAWN_RATE = 150; // frames between obstacles
        const JUMP_FORCE = 15;
        const GRAVITY = 0.8;

        // Game state
        let scene, camera, renderer;
        let ground, trex, obstacles = [];
        let speed = INITIAL_SPEED;
        let score = 0;
        let isGameOver = false;
        let isJumping = false;
        let verticalVelocity = 0;
        let frameCount = 0;
        let clock = new THREE.Clock();

        // Initialize Three.js
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);
            camera.lookAt(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            scene.add(directionalLight);

            // Ground
            createGround();

            // Trex
            trex = createTrex();
            scene.add(trex);

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);

            // Start game loop
            animate();
        }

        // Create procedural low-poly ground
        function createGround() {
            const geometry = new THREE.PlaneGeometry(GROUND_WIDTH, GROUND_HEIGHT, 8, 8);
            // Add some randomness for low-poly effect
            const position = geometry.attributes.position;
            for (let i = 0; i < position.count; i++) {
                const x = position.getX(i);
                const y = position.getY(i);
                const z = position.getZ(i);
                position.setY(i, y + (Math.random() - 0.5) * 2);
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -2;
            scene.add(ground);
        }

        // Create low-poly Trex using basic shapes
        function createTrex() {
            const group = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.BoxGeometry(4, 3, 6);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.5;
            group.add(body);

            // Head
            const headGeometry = new THREE.BoxGeometry(2.5, 2.5, 2.5);
            const headMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(3, 3, 0);
            group.add(head);

            // Tail
            const tailGeometry = new THREE.BoxGeometry(2, 2, 4);
            const tailMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.set(-3, 1.5, 0);
            group.add(tail);

            // Legs (simplified)
            const legGeometry = new THREE.BoxGeometry(0.8, 2, 0.8);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x006400 });
            const leg1 = new THREE.Mesh(legGeometry, legMaterial);
            leg1.position.set(-1, -0.5, 1.5);
            const leg2 = leg1.clone();
            leg2.position.set(-1, -0.5, -1.5);
            const leg3 = leg1.clone();
            leg3.position.set(1, -0.5, 1.5);
            const leg4 = leg1.clone();
            leg4.position.set(1, -0.5, -1.5);
            group.add(leg1, leg2, leg3, leg4);

            group.position.set(0, 0, 0);
            return group;
        }

        // Create obstacle (low-poly cactus)
        function createObstacle() {
            const group = new THREE.Group();

            // Main trunk
            const trunkGeometry = new THREE.BoxGeometry(1, 3 + Math.random() * 2, 1);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x556B2F });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1.5 + trunkGeometry.parameters.height / 2;
            group.add(trunk);

            // Arms
            const armCount = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < armCount; i++) {
                const armGeometry = new THREE.BoxGeometry(0.6, 0.6, 1.5 + Math.random());
                const armMaterial = new THREE.MeshStandardMaterial({ color: 0x556B2F });
                const arm = new THREE.Mesh(armGeometry, armMaterial);
                arm.position.y = 0.5 + Math.random() * 2;
                arm.position.z = (Math.random() - 0.5) * 0.8;
                group.add(arm);
            }

            group.position.set(GROUND_WIDTH / 2 + 5, 0, (Math.random() - 0.5) * 5);
            return group;
        }

        // Spawn obstacles
        function spawnObstacle() {
            if (Math.random() < 0.3) return; // 30% chance to spawn
            const obstacle = createObstacle();
            obstacles.push(obstacle);
            scene.add(obstacle);
        }

        // Update obstacles
        function updateObstacles(delta) {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.position.x -= speed * delta;

                // Remove if off screen
                if (obstacle.position.x < -GROUND_WIDTH / 2 - 5) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                    continue;
                }

                // Simple collision detection (bounding box approximation)
                if (obstacle.position.x < trex.position.x + 2 &&
                    obstacle.position.x > trex.position.x - 2 &&
                    obstacle.position.z > trex.position.z - 2 &&
                    obstacle.position.z < trex.position.z + 2 &&
                    obstacle.position.y < trex.position.y + 3) {
                    gameOver();
                }
            }
        }

        // Update Trex (jumping and gravity)
        function updateTrex(delta) {
            if (isJumping) {
                verticalVelocity -= GRAVITY * delta * 60; // Apply gravity
                trex.position.y += verticalVelocity * delta * 60;

                // Check if landed
                if (trex.position.y <= 0) {
                    trex.position.y = 0;
                    isJumping = false;
                    verticalVelocity = 0;
                }
            }
        }

        // Handle key down
        function onKeyDown(event) {
            if (event.code === 'Space' && !isJumping && !isGameOver) {
                isJumping = true;
                verticalVelocity = JUMP_FORCE;
            }
            if (event.code === 'Space' && isGameOver) {
                restartGame();
            }
        }

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Game over
        function gameOver() {
            isGameOver = true;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('restartBtn').style.display = 'block';
        }

        // Restart game
        function restartGame() {
            // Reset game state
            speed = INITIAL_SPEED;
            score = 0;
            isGameOver = false;
            isJumping = false;
            verticalVelocity = 0;
            trex.position.y = 0;

            // Remove obstacles
            obstacles.forEach(obstacle => scene.remove(obstacle));
            obstacles = [];

            // Hide UI
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';

            // Reset score display
            document.getElementById('score').textContent = 'Score: 0';
        }

        // Main animation loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (!isGameOver) {
                // Update score and speed
                score += delta * 10;
                speed = INITIAL_SPEED + score * SPEED_INCREASE;
                document.getElementById('score').textContent = 'Score: ' + Math.floor(score);

                // Spawn obstacles
                frameCount++;
                if (frameCount > OBSTACLE_SPAWN_RATE) {
                    spawnObstacle();
                    frameCount = 0;
                }

                // Update game objects
                updateTrex(delta);
                updateObstacles(delta);
            }

            renderer.render(scene, camera);
        }

        // Start the game
        init();
    </script>
</body>
</html>
