<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Dino Run</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #score-container {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #FFF;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            display: none;
            text-align: center;
        }
        #game-over span {
            display: block;
            margin-top: 20px;
            font-size: 24px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="score-container">0</div>
    <div id="game-over">
        GAME OVER
        <span>Press SPACE to restart</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let dino, ground;
        let obstacles = [];
        let particles = [];
        let clouds = [];
        let gameActive = true;
        let score = 0;
        let speed = 0.35;
        let jumpVelocity = 0.18;
        let gravity = 0.012;
        let groundHeight = -2;

        const colors = {
            sky: '#87CEEB',
            ground: '#C4A659',
            dinoBody: '#E8B438',
            dinoSkin: '#D4A028',
            cactus: '#7BC342',
            cactusDark: '#6BA838',
            rock: '#8C8C8C',
            rockDark: '#757575',
            sun: '#FFD93D'
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(colors.sky);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(-5, 3, 5);
            camera.lookAt(0, groundHeight + 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(-10, 15, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 50;
            dirLight.shadow.camera.left = -15;
            dirLight.shadow.camera.right = 15;
            dirLight.shadow.camera.top = 15;
            dirLight.shadow.camera.bottom = -15;
            scene.add(dirLight);

            // Ground
            createGround();

            // Dino
            dino = createDino();
            scene.add(dino);

            // Sun
            const sunGeometry = new THREE.SphereGeometry(3, 16, 8);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: colors.sun });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(-5, 8, -20);
            scene.add(sun);

            // Create initial obstacles and particles
            for (let i = 0; i < 10; i++) {
                spawnObstacle();
            }
            for (let i = 0; i < 30; i++) {
                createParticle();
            }
            for (let i = 0; i < 5; i++) {
                createCloud();
            }

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
        }

        function createGround() {
            const geometry = new THREE.PlaneGeometry(100, 200);

            // Create dune-like terrain with vertex displacement
            const positionAttribute = geometry.attributes.position;
            for (let i = 0; i < positionAttribute.count; i++) {
                const x = positionAttribute.getX(i);
                let y = positionAttribute.getY(i);
                
                if (Math.abs(x) > 15) {
                    y += Math.sin((x + i * 0.3) * 0.2) * 0.8;
                    y += Math.cos(x * 0.15) * 0.4;
                }
                
                positionAttribute.setY(i, y);
            }

            geometry.computeVertexNormals();

            // Ground material with shading
            const material = new THREE.MeshStandardMaterial({ 
                color: colors.ground,
                roughness: 0.9,
                flatShading: true
            });

            ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -50;
            ground.receiveShadow = true;
            scene.add(ground);

            // Ground border
            const borderGeometry = new THREE.BoxGeometry(100, 1, 3);
            const borderMaterial = new THREE.MeshStandardMaterial({ color: '#B89642' });
            const groundBorder = new THREE.Mesh(borderGeometry, borderMaterial);
            groundBorder.rotation.x = -Math.PI / 2;
            groundBorder.position.z = -50.75;
            scene.add(groundBorder);
        }

        function createDino() {
            const dinoGroup = new THREE.Group();

            // Body (cuboid)
            const bodyGeometry = new THREE.BoxGeometry(0.8, 0.9, 1);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: colors.dinoBody });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.65;
            body.castShadow = true;
            dinoGroup.add(body);

            // Head (slightly larger box)
            const headGeometry = new THREE.BoxGeometry(0.7, 0.8, 0.9);
            const headMaterial = new THREE.MeshStandardMaterial({ color: colors.dinoSkin });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(0, 1.35, 0.4);
            head.castShadow = true;
            dinoGroup.add(head);

            // Snout
            const snoutGeometry = new THREE.BoxGeometry(0.4, 0.3, 0.3);
            const snoutMaterial = new THREE.MeshStandardMaterial({ color: colors.dinoSkin });
            const snout = new THREE.Mesh(snoutGeometry, snoutMaterial);
            snout.position.set(0, 1.5, 1);
            snout.castShadow = true;
            dinoGroup.add(snout);

            // Left arm (smaller box)
            const armGeometry = new THREE.BoxGeometry(0.2, 0.7, 0.3);
            const leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
            leftArm.position.set(-0.5, 1, -0.2);
            leftArm.castShadow = true;
            dinoGroup.add(leftArm);

            // Right arm
            const rightArm = new THREE.Mesh(armGeometry, bodyMaterial);
            rightArm.position.set(0.5, 1, -0.2);
            rightArm.castShadow = true;
            dinoGroup.add(rightArm);

            // Left leg (thigh)
            const leftLegGeometry = new THREE.BoxGeometry(0.3, 0.7, 0.4);
            const leftLegThigh = new THREE.Mesh(leftLegGeometry, bodyMaterial);
            leftLegThigh.position.set(-0.25, 0.1, 0);
            leftLegThigh.castShadow = true;
            dinoGroup.add(leftLegThigh);

            // Right leg (thigh)
            const rightLegThigh = new THREE.Mesh(leftLegGeometry, bodyMaterial);
            rightLegThigh.position.set(0.25, 0.1, 0);
            rightLegThigh.castShadow = true;
            dinoGroup.add(rightLegThigh);

            // Tail (small box)
            const tailGeometry = new THREE.BoxGeometry(0.4, 0.3, 0.6);
            const tailMaterial = new THREE.MeshStandardMaterial({ color: colors.dinoBody });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.set(-0.6, 0.7, -0.3);
            tail.castShadow = true;
            dinoGroup.add(tail);

            return dinoGroup;
        }

        function createObstacle() {
            const type = Math.random();
            
            if (type < 0.6) {
                // Cactus - low poly cylinder with spines
                const geometry = new THREE.CylinderGeometry(0.15, 0.25, 1 + Math.random(), 8);
                
                let material;
                if (type < 0.4) {
                    // Single cactus
                    material = new THREE.MeshStandardMaterial({ 
                        color: colors.cactus,
                        flatShading: true
                    });
                } else if (type < 0.6) {
                    // Double cactus
                    const group = new THREE.Group();
                    
                    const leftCactusGeometry = new THREE.CylinderGeometry(0.15, 0.25, 1 + Math.random(), 8);
                    const leftCactusMaterial = new THREE.MeshStandardMaterial({ 
                        color: colors.cactus,
                        flatShading: true
                    });
                    const leftCactus = new THREE.Mesh(leftCactusGeometry, leftCactusMaterial);
                    leftCactus.position.x = -0.4;
                    leftCactus.castShadow = true;
                    
                    const rightCactus = new THREE.Mesh(leftCactusGeometry, leftCactusMaterial);
                    rightCactus.position.x = 0.4;
                    rightCactus.castShadow = true;
                    
                    group.add(leftCactus);
                    group.add(rightCactus);
                    
                    return { mesh: group, type: 'cactus', height: 1 + Math.random() };
                } else {
                    // Multi-cactus
                    const group = new THREE.Group();
                    
                    for (let i = 0; i < 3; i++) {
                        const cactusGeometry = new THREE.CylinderGeometry(0.15, 0.25, 0.8 + Math.random() * 0.4, 6);
                        const cactusMaterial = new THREE.MeshStandardMaterial({ 
                            color: colors.cactus,
                            flatShading: true
                        });
                        const cactus = new THREE.Mesh(cactusGeometry, cactusMaterial);
                        cactus.position.x = (i - 1) * 0.6;
                        cactus.castShadow = true;
                        group.add(cactus);
                    }
                    
                    return { mesh: group, type: 'cactus', height: 0.8 + Math.random() * 0.4 };
                }
            } else if (type < 0.9) {
                // Rock - irregular low poly shape
                const geometry = new THREE.DodecahedronGeometry(0.5, 0);
                const material = new THREE.MeshStandardMaterial({ 
                    color: colors.rock,
                    flatShading: true
                });
                const rock = new THREE.Mesh(geometry, material);
                rock.position.y = 0.4 + Math.random() * 0.3;
                rock.rotation.z = (Math.random() - 0.5) * 0.3;
                rock.rotation.x = (Math.random() - 0.5) * 0.3;
                rock.castShadow = true;
                
                return { mesh: rock, type: 'rock', height: 0.4 + Math.random() * 0.3 };
            } else {
                // Bush - cluster of spheres/irregular shapes
                const group = new THREE.Group();
                
                for (let i = 0; i < 8; i++) {
                    const geometry = new THREE.DodecahedronGeometry(0.15 + Math.random() * 0.2, 0);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: type < 0.9 ? colors.cactusDark : '#6BB840',
                        flatShading: true
                    });
                    const bushPart = new THREE.Mesh(geometry, material);
                    
                    bushPart.position.set(
                        (Math.random() - 0.5) * 1.2,
                        0.3 + Math.random() * 0.4,
                        (Math.random() - 0.5) * 0.6
                    );
                    bushPart.castShadow = true;
                    
                    group.add(bushPart);
                }
                
                return { mesh: group, type: 'bush', height: 0.3 + Math.random() * 0.4 };
            }
        }

        function spawnObstacle() {
            const obstacleData = createObstacle();
            
            // Random position ahead of camera
            const xPosition = (Math.random() - 0.5) * 8;
            obstacleData.mesh.position.set(xPosition, groundHeight, -60);
            obstacleData.mesh.castShadow = true;
            
            obstacles.push(obstacleData);
        }

        function createParticle() {
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0)]);
            const material = new THREE.PointsMaterial({
                color: colors.cactusDark,
                size: 0.15 + Math.random() * 0.2,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            const particle = new THREE.Points(geometry, material);
            
            // Position along the ground
            const xPosition = (Math.random() - 0.5) * 18;
            particle.position.set(xPosition, groundHeight + 0.05, -40 - Math.random() * 20);
            
            particles.push({
                mesh: particle,
                velocityX: (Math.random() - 0.5) * 0.05,
                decay: 0.01 + Math.random() * 0.02
            });

            scene.add(particle);
        }

        function createCloud() {
            const group = new THREE.Group();
            
            // Create low-poly cloud from spheres
            for (let i = 0; i < 4; i++) {
                const geometry = new THREE.SphereGeometry(0.8 + Math.random() * 0.6, 7, 5);
                const material = new THREE.MeshStandardMaterial({
                    color: '#FFFFFF',
                    transparent: true,
                    opacity: 0.9,
                    flatShading: true
                });
                
                const cloudPart = new THREE.Mesh(geometry, material);
                cloudPart.position.set(
                    (i - 1.5) * 2.2 + Math.random(),
                    6 + Math.random() * 1.5,
                    (-8 - Math.random() * 4)
                );
                cloudPart.rotation.z = (Math.random() - 0.5) * 0.3;
                
                group.add(cloudPart);
            }
            
            const xPosition = (Math.random() - 0.5) * 30;
            group.position.set(xPosition, 7 + Math.random(), -80);
            
            clouds.push({ mesh: group });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                
                if (!gameActive && dino.position.y <= groundHeight + 0.1) {
                    resetGame();
                } else if (dino.position.y > groundHeight) {
                    jump();
                }
            }
        }

        function jump() {
            const velocityY = new THREE.Vector3(0, jumpVelocity, 0);
            
            // Animate arms moving backward during jump
            dino.children[3].rotation.x = -0.5; // Left arm
            dino.children[4].rotation.x = -0.5; // Right arm
            
            setTimeout(() => {
                dino.children[3].rotation.x = 0;
                dino.children[4].rotation.x = 0;
            }, 200);

            setTimeout(() => {
                if (dino.position.y > groundHeight) {
                    dino.children[3].rotation.x = -0.5;
                    dino.children[4].rotation.x = -0.5;
                    
                    setTimeout(() => {
                        dino.children[3].rotation.x = 0;
                        dino.children[4].rotation.x = 0;
                    }, 200);
                }
            }, 400);

            velocityY.applyQuaternion(dino.quaternion);
            dino.position.add(velocityY);
        }

        function updateParticles() {
            const time = Date.now() * 0.001;
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                // Move left with game speed
                particle.mesh.position.x -= speed;
                particle.mesh.position.z += particle.velocityX * 2;
                
                // Animate floating
                particle.mesh.position.y = groundHeight + 0.05 + Math.sin(time * 3 + particle.mesh.position.x) * 0.1;
                
                // Fade out and recycle
                if (particle.mesh.material.opacity > 0.1) {
                    particle.mesh.material.opacity -= particle.decay;
                } else {
                    scene.remove(particle.mesh);
                    particles.splice(i, 1);
                    continue;
                }

                // Recycle if too far
                if (particle.mesh.position.x < -25 || particle.mesh.position.z > 0) {
                    particle.mesh.material.opacity = 0.6;
                    particle.mesh.position.set(
                        Math.random() * 18,
                        groundHeight + 0.05,
                        -40 - Math.random() * 20
                    );
                }
            }

            // Add new particles periodically
            if (Math.floor(Date.now() * 0.01) % 10 === 0 && particles.length < 30) {
                createParticle();
            }
        }

        function updateClouds() {
            const time = Date.now() * 0.0005;
            
            clouds.forEach(cloud => {
                cloud.mesh.position.x -= speed * 0.2;
                cloud.mesh.rotation.z += 0.001;
                
                if (cloud.mesh.position.x < -35) {
                    cloud.mesh.position.set(Math.random() * 30, 7 + Math.random(), -80);
                }

                // Animate individual parts
                for (let i = 0; i < cloud.mesh.children.length; i++) {
                    const part = cloud.mesh.children[i];
                    part.rotation.z += 0.002;
                }
            });
        }

        function checkCollision(dino, obstacle) {
            // Get bounding boxes
            const dinoBox = new THREE.Box3().setFromObject(dino);
            const obstacleBox = new THREE.Box3().setFromObject(obstacle.mesh);
            
            return dinoBox.intersectsBox(obstacleBox);
        }

        function updateGame() {
            if (!gameActive) return;

            // Apply gravity to dino
            if (dino.position.y > groundHeight + 0.15) {
                dino.position.y -= gravity * (dino.position.y - groundHeight);
                
                // Ground collision
                if (dino.position.y <= groundHeight) {
                    dino.position.y = groundHeight;
                }
            }

            // Animate arms running
            const time = Date.now() * 0.15;
            dino.children[3].rotation.x = Math.sin(time) * 0.3; // Left arm
            dino.children[4].rotation.x = -Math.sin(time) * 0.3; // Right arm

            // Move obstacles toward camera
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                
                obstacle.mesh.position.z += speed;
                obstacle.mesh.rotation.y += 0.01;
                
                // Increase speed gradually
                if (score > 5 && score % 5 === 0) {
                    speed = Math.min(0.6, speed + 0.02);
                }

                // Check collision
                if (checkCollision(dino, obstacle)) {
                    gameOver();
                }

                // Remove obstacles that pass camera
                if (obstacle.mesh.position.z > 5) {
                    scene.remove(obstacle.mesh);
                    obstacles.splice(i, 1);
                    
                    // Respawn a new obstacle
                    setTimeout(() => spawnObstacle(), 2000 + Math.random() * 2000);
                }
            }

            // Spawn new obstacles periodically
            if (Math.floor(Date.now() * 0.01) % 35 === 0 && obstacles.length < 8) {
                spawnObstacle();
            }

            // Update particles and clouds
            updateParticles();
            updateClouds();

            // Update score
            score = Math.floor((Date.now() - startTime) / 100);
            document.getElementById('score-container').textContent = score;
        }

        let startTime;
        function resetGame() {
            gameActive = true;
            score = 0;
            speed = 0.35;
            dino.position.y = groundHeight;
            
            // Clear obstacles
            obstacles.forEach(obstacle => scene.remove(obstacle.mesh));
            obstacles = [];
            
            // Spawn initial obstacles
            for (let i = 0; i < 10; i++) {
                setTimeout(() => spawnObstacle(), i * 300);
            }
            
            document.getElementById('game-over').style.display = 'none';
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('game-over').style.display = 'block';
            
            // Fall down effect
            let fallSpeed = 0.1;
            const fallInterval = setInterval(() => {
                dino.position.y -= fallSpeed;
                
                if (dino.position.y <= groundHeight) {
                    clearInterval(fallInterval);
                }
            }, 16);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (gameActive || dino.position.y > groundHeight) {
                updateGame();
            }
            
            renderer.render(scene, camera);
        }

        // Start game
        init();
        startTime = Date.now();
        animate();
    </script>
</body>
</html>
