<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }
        #score {
            font-size: 32px;
            color: #ffcc00;
        }
        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 100;
        }
        #gameOver h1 {
            font-size: 48px;
            color: #ff4444;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            margin-bottom: 20px;
        }
        #gameOver p {
            font-size: 24px;
            color: #fff;
            margin-bottom: 30px;
        }
        #restartBtn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #restartBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
    </div>
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">Play Again</button>
    </div>
    <div id="instructions">Press SPACE to jump</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, dino, ground;
        let obstacles = [];
        let groundSegments = [];
        let score = 0;
        let speed = 0.3;
        let isGameOver = false;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        const jumpForce = 0.4;
        let lastObstacleTime = 0;
        let minObstacleInterval = 1500;

        const colors = {
            sky: 0x87CEEB,
            ground: 0xD2B48C,
            dino: 0x2E8B57,
            dinoAccent: 0x228B22,
            cactus: 0x228B22,
            rock: 0x808080,
            sun: 0xFFD700
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(colors.sky);
            scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-5, 5, 10);
            camera.lookAt(5, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 50;
            sunLight.shadow.camera.left = -30;
            sunLight.shadow.camera.right = 30;
            sunLight.shadow.camera.top = 30;
            sunLight.shadow.camera.bottom = -30;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight(0xffeedd, 0.3);
            fillLight.position.set(-10, 5, -10);
            scene.add(fillLight);

            createSun();
            createGround();
            createDino();
            createMountains();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);

            document.getElementById('restartBtn').addEventListener('click', restartGame);

            animate();
        }

        function createSun() {
            const sunGeometry = new THREE.SphereGeometry(3, 16, 16);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: colors.sun });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(30, 25, -50);
            scene.add(sun);
        }

        function createGround() {
            const segmentWidth = 20;
            for (let i = 0; i < 5; i++) {
                const groundGeo = new THREE.PlaneGeometry(segmentWidth, 100);
                const groundMat = new THREE.MeshLambertMaterial({ color: colors.ground });
                const groundMesh = new THREE.Mesh(groundGeo, groundMat);
                groundMesh.rotation.x = -Math.PI / 2;
                groundMesh.position.z = -i * segmentWidth;
                groundMesh.receiveShadow = true;
                scene.add(groundMesh);
                groundSegments.push(groundMesh);
            }
        }

        function createDino() {
            dino = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.5, 1, 1);
            const bodyMat = new THREE.MeshLambertMaterial({ color: colors.dino });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5;
            body.castShadow = true;
            dino.add(body);

            const headGeo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0.8, 2.2, 0);
            head.castShadow = true;
            dino.add(head);

            const snoutGeo = new THREE.BoxGeometry(0.5, 0.3, 0.5);
            const snout = new THREE.Mesh(snoutGeo, bodyMat);
            snout.position.set(1.3, 2, 0);
            snout.castShadow = true;
            dino.add(snout);

            const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(1.1, 2.3, 0.3);
            dino.add(eyeL);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(1.1, 2.3, -0.3);
            dino.add(eyeR);

            const backGeo = new THREE.BoxGeometry(0.3, 0.5, 0.6);
            const backMat = new THREE.MeshLambertMaterial({ color: colors.dinoAccent });
            const back = new THREE.Mesh(backGeo, backMat);
            back.position.set(-0.3, 2.2, 0);
            back.castShadow = true;
            dino.add(back);

            const tailGeo = new THREE.ConeGeometry(0.3, 1.2, 4);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(-1.2, 1.8, 0);
            tail.rotation.z = Math.PI / 2;
            tail.castShadow = true;
            dino.add(tail);

            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legMat = new THREE.MeshLambertMaterial({ color: colors.dinoAccent });

            const legFL = new THREE.Mesh(legGeo, legMat);
            legFL.position.set(0.3, 0.4, 0.3);
            legFL.castShadow = true;
            legFL.name = 'legFL';
            dino.add(legFL);

            const legFR = new THREE.Mesh(legGeo, legMat);
            legFR.position.set(0.3, 0.4, -0.3);
            legFR.castShadow = true;
            legFR.name = 'legFR';
            dino.add(legFR);

            const legBL = new THREE.Mesh(legGeo, legMat);
            legBL.position.set(-0.5, 0.4, 0.3);
            legBL.castShadow = true;
            legBL.name = 'legBL';
            dino.add(legBL);

            const legBR = new THREE.Mesh(legGeo, legMat);
            legBR.position.set(-0.5, 0.4, -0.3);
            legBR.castShadow = true;
            legBR.name = 'legBR';
            dino.add(legBR);

            const armGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
            const armL = new THREE.Mesh(armGeo, legMat);
            armL.position.set(0.5, 1.2, 0.4);
            armL.rotation.z = 0.3;
            dino.add(armL);
            const armR = new THREE.Mesh(armGeo, legMat);
            armR.position.set(0.5, 1.2, -0.4);
            armR.rotation.z = 0.3;
            dino.add(armR);

            dino.position.set(0, 0, 0);
            scene.add(dino);
        }

        function createMountains() {
            for (let i = 0; i < 20; i++) {
                const height = 5 + Math.random() * 15;
                const width = 3 + Math.random() * 8;
                const mountainGeo = new THREE.ConeGeometry(width, height, 4);
                const hue = 0.1 + Math.random() * 0.1;
                const mountainMat = new THREE.MeshLambertMaterial({
                    color: new THREE.Color().setHSL(hue, 0.3, 0.4 + Math.random() * 0.2)
                });
                const mountain = new THREE.Mesh(mountainGeo, mountainMat);
                mountain.position.set(
                    -20 + Math.random() * 100,
                    height / 2,
                    -80 - Math.random() * 50
                );
                mountain.rotation.y = Math.random() * Math.PI;
                scene.add(mountain);
            }
        }

        function createCactus() {
            const cactusGroup = new THREE.Group();
            const cactusMat = new THREE.MeshLambertMaterial({ color: colors.cactus });

            const mainHeight = 1 + Math.random() * 1.5;
            const mainGeo = new THREE.BoxGeometry(0.5, mainHeight, 0.5);
            const main = new THREE.Mesh(mainGeo, cactusMat);
            main.position.y = mainHeight / 2;
            main.castShadow = true;
            cactusGroup.add(main);

            if (Math.random() > 0.3) {
                const armHeight = 0.5 + Math.random() * 0.5;
                const armGeo = new THREE.BoxGeometry(0.3, armHeight, 0.3);
                const arm = new THREE.Mesh(armGeo, cactusMat);
                arm.position.set(0.4, mainHeight * 0.6, 0);
                arm.rotation.z = -Math.PI / 4;
                arm.castShadow = true;
                cactusGroup.add(arm);

                const topGeo = new THREE.BoxGeometry(0.3, 0.4, 0.3);
                const top = new THREE.Mesh(topGeo, cactusMat);
                top.position.set(0.7, mainHeight * 0.6 + 0.3, 0);
                top.castShadow = true;
                cactusGroup.add(top);
            }

            if (Math.random() > 0.5) {
                const arm2Height = 0.4 + Math.random() * 0.4;
                const armGeo2 = new THREE.BoxGeometry(0.3, arm2Height, 0.3);
                const arm2 = new THREE.Mesh(armGeo2, cactusMat);
                arm2.position.set(-0.4, mainHeight * 0.4, 0);
                arm2.rotation.z = Math.PI / 4;
                arm2.castShadow = true;
                cactusGroup.add(arm2);
            }

            cactusGroup.position.z = -80;
            scene.add(cactusGroup);
            obstacles.push({ mesh: cactusGroup, type: 'cactus', height: mainHeight });
        }

        function createRock() {
            const rockGroup = new THREE.Group();
            const rockMat = new THREE.MeshLambertMaterial({ color: colors.rock });

            const size = 0.5 + Math.random() * 0.5;
            const rockGeo = new THREE.DodecahedronGeometry(size, 0);
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.y = size * 0.5;
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            rockGroup.add(rock);

            if (Math.random() > 0.5) {
                const smallSize = size * 0.5;
                const smallRockGeo = new THREE.DodecahedronGeometry(smallSize, 0);
                const smallRock = new THREE.Mesh(smallRockGeo, rockMat);
                smallRock.position.set(size * 0.5, smallSize * 0.5, 0);
                smallRock.rotation.set(Math.random(), Math.random(), Math.random());
                smallRock.castShadow = true;
                rockGroup.add(smallRock);
            }

            rockGroup.position.z = -80;
            scene.add(rockGroup);
            obstacles.push({ mesh: rockGroup, type: 'rock', height: size });
        }

        function createObstacle() {
            if (Math.random() > 0.5) {
                createCactus();
            } else {
                createRock();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            if (event.code === 'Space' && !isJumping && !isGameOver) {
                jumpVelocity = jumpForce;
                isJumping = true;
            }
        }

        function checkCollision() {
            const dinoBox = {
                minX: dino.position.x - 0.5,
                maxX: dino.position.x + 1.2,
                minY: dino.position.y,
                maxY: dino.position.y + 2.5
            };

            for (let obstacle of obstacles) {
                const obstacleBox = {
                    minX: obstacle.mesh.position.x - 0.5,
                    maxX: obstacle.mesh.position.x + 0.5,
                    minY: 0,
                    maxY: obstacle.height
                };

                if (dinoBox.maxX > obstacleBox.minX &&
                    dinoBox.minX < obstacleBox.maxX &&
                    dinoBox.maxY > obstacleBox.minY &&
                    dinoBox.minY < obstacleBox.maxY) {
                    return true;
                }
            }
            return false;
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            for (let obstacle of obstacles) {
                scene.remove(obstacle.mesh);
            }
            obstacles = [];

            score = 0;
            speed = 0.3;
            isGameOver = false;
            isJumping = false;
            jumpVelocity = 0;
            dino.position.y = 0;
            lastObstacleTime = 0;

            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('score').textContent = '0';
        }

        let legAngle = 0;
        let frameCount = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                frameCount++;
                score += speed * 0.1;
                document.getElementById('score').textContent = Math.floor(score);

                speed = 0.3 + score * 0.001;

                if (isJumping) {
                    dino.position.y += jumpVelocity;
                    jumpVelocity -= gravity;

                    if (dino.position.y <= 0) {
                        dino.position.y = 0;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }

                legAngle += speed * 0.5;
                dino.children.forEach(child => {
                    if (child.name && child.name.includes('leg')) {
                        child.rotation.x = Math.sin(legAngle) * 0.3;
                    }
                });

                const timeSinceObstacle = Date.now() - lastObstacleTime;
                if (timeSinceObstacle > minObstacleInterval / (speed / 0.3)) {
                    createObstacle();
                    lastObstacleTime = Date.now();
                    minObstacleInterval = 1000 + Math.random() * 1000;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].mesh.position.x += speed;

                    if (obstacles[i].mesh.position.x > 10) {
                        scene.remove(obstacles[i].mesh);
                        obstacles.splice(i, 1);
                    }
                }

                for (let segment of groundSegments) {
                    segment.position.z += speed;
                    if (segment.position.z > 10) {
                        segment.position.z -= 100;
                    }
                }

                if (checkCollision()) {
                    gameOver();
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
